# MARK: EXTERA
# Builds an IPA with a self-signed (fake) signature for sideloading (Sideloadly re-signs it
# with the user's Apple ID). Secrets: TG_API_ID, TG_API_HASH (from my.telegram.org).
name: ExteraIOS build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Make.py configuration'
        type: choice
        options:
          - release_arm64
          - debug_arm64
        default: release_arm64
      continue_on_error:
        description: 'Pass --continueOnError (show all compile errors at once)'
        type: boolean
        default: false
  push:
    branches: [ master, 'exteraios/**' ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: exteraios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTERAIOS_BUNDLE_ID: com.itzchelove4ik.exteraios
  # Fake team ID: only used for the self-signed build, Sideloadly replaces it on re-signing.
  EXTERAIOS_FAKE_TEAM_ID: EXTERAIOS1
  EXTERAIOS_URL_SCHEME: exteraios
  SOURCE_DIR: /Users/Shared/telegram-ios
  BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
  BAZEL_CACHE_DIR: /Users/Shared/bazel-disk-cache

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Environment
        run: |
          sw_vers
          df -h /
          sysctl -n hw.ncpu hw.memsize
          ls /Applications | grep -i xcode

      - name: Select Xcode from versions.json
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          # source code paths are included in the final binary, keep them stable across builds
          sudo mkdir -p /Users/Shared
          sudo chown "$(whoami)" /Users/Shared
          rm -rf "$SOURCE_DIR"
          cp -R "$GITHUB_WORKSPACE" "$SOURCE_DIR"

      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-${{ inputs.configuration || 'release_arm64' }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ inputs.configuration || 'release_arm64' }}-

      - name: Generate fake codesigning
        run: |
          cd "$SOURCE_DIR"
          python3 build-system/exteraios/generate_fake_codesigning.py             --bundle-id "$EXTERAIOS_BUNDLE_ID"             --team-id "$EXTERAIOS_FAKE_TEAM_ID"             --template build-system/fake-codesigning             --output "$RUNNER_TEMP/codesigning"
          python3 build-system/Make/ImportCertificates.py --path "$RUNNER_TEMP/codesigning/certs"
          security find-identity -p codesigning

      - name: Check secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Repository secrets TG_API_ID and TG_API_HASH are not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Generate build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'EOF'
          import json, os
          config = {
              "bundle_id": os.environ["EXTERAIOS_BUNDLE_ID"],
              "api_id": os.environ["TG_API_ID"],
              "api_hash": os.environ["TG_API_HASH"],
              "team_id": os.environ["EXTERAIOS_FAKE_TEAM_ID"],
              "is_internal_build": "false",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": os.environ["EXTERAIOS_URL_SCHEME"],
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
              "sg_config": ""
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "exteraios-configuration.json")
          with open(path, "w") as f:
              json.dump(config, f, indent=2)
          print("wrote", path)
          EOF

      - name: Build
        id: build
        run: |
          set -x
          cd "$SOURCE_DIR"
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          BUILD_NUMBER="$(( $(git rev-list --count HEAD) + BUILD_NUMBER_OFFSET ))"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          mkdir -p "$BAZEL_CACHE_DIR"

          EXTRA_BUILD_ARGS=""
          if [ "${{ inputs.continue_on_error }}" = "true" ]; then
            EXTRA_BUILD_ARGS="--continueOnError"
          fi

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build $EXTRA_BUILD_ARGS \
            --configurationPath="$RUNNER_TEMP/exteraios-configuration.json" \
            --codesigningInformationPath="$RUNNER_TEMP/codesigning" \
            --configuration=${{ inputs.configuration || 'release_arm64' }} \
            --buildNumber="$BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/build.log"
          exit ${PIPESTATUS[0]}

      - name: Collect IPA
        run: |
          cd "$SOURCE_DIR"
          mkdir -p "$RUNNER_TEMP/out"
          cp bazel-bin/Telegram/Telegram.ipa "$RUNNER_TEMP/out/ExteraIOS-$APP_VERSION-$BUILD_NUMBER.ipa"
          ls -la "$RUNNER_TEMP/out"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ExteraIOS-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}-${{ inputs.configuration || 'release_arm64' }}
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.run_id }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Save Bazel disk cache
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-${{ inputs.configuration || 'release_arm64' }}-${{ github.sha }}
