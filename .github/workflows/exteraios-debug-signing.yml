# MARK: EXTERA
# Quick experiment for importing the self-signed identity on macOS runners (no submodules, no build).
name: ExteraIOS debug signing

on:
  push:
    branches: [ 'exteraios/debug-**' ]

jobs:
  signing:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Try PKCS#12 variants
        run: |
          set +e -x
          which -a openssl; openssl version; /usr/bin/openssl version
          OUT="$RUNNER_TEMP/cs"
          python3 build-system/exteraios/generate_fake_codesigning.py --bundle-id com.itzchelove4ik.exteraios --team-id EXTERAIOS1 \
            --template build-system/fake-codesigning --output "$OUT" --pkcs12-openssl /usr/bin/openssl > /dev/null
          openssl pkcs12 -in "$OUT/certs/SelfSigned.p12" -passin pass: -info -noout 2>&1 | head -10 || true
          KC=dbg.keychain
          security create-keychain -p secret $KC
          security unlock-keychain -p secret $KC
          echo "== A: generated p12, empty password"
          security import "$OUT/certs/SelfSigned.p12" -k $KC -P "" -T /usr/bin/codesign -T /usr/bin/security; echo "rc=$?"
          security find-identity -p codesigning $KC
          echo "== B: upstream SelfSigned.p12, empty password"
          security import build-system/fake-codesigning/certs/SelfSigned.p12 -k $KC -P "" -T /usr/bin/codesign; echo "rc=$?"
          security find-identity -p codesigning $KC
          echo "== C: re-export with password via OpenSSL -legacy"
          openssl pkcs12 -in "$OUT/certs/SelfSigned.p12" -passin pass: -nodes -out "$RUNNER_TEMP/all.pem" || true
          openssl pkcs12 -export -legacy -in "$RUNNER_TEMP/all.pem" -passout pass:pw -out "$RUNNER_TEMP/legacy.p12" || true
          security import "$RUNNER_TEMP/legacy.p12" -k $KC -P pw -T /usr/bin/codesign; echo "rc=$?"
          security find-identity -p codesigning $KC
          echo "== D: separate key + cert import"
          openssl pkcs12 -in "$OUT/certs/SelfSigned.p12" -passin pass: -nocerts -nodes -out "$RUNNER_TEMP/key.pem" || true
          security import "$RUNNER_TEMP/key.pem" -k $KC -t priv -f openssl -T /usr/bin/codesign; echo "rc=$?"
          security import "$OUT/certs/Public.cer" -k $KC; echo "rc=$?"
          security find-identity -p codesigning $KC
          security set-key-partition-list -S apple-tool:,apple: -k secret $KC > /dev/null; echo "partition rc=$?"
